services:
  - type: web
    name: cell-portal
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATASETS_DIR
        value: /app/datasets
      - key: WORMBASE_CACHE_DIR
        value: /app/cache/wormbase
      - key: MAX_BROWSER_CELLS
        value: "3000"
      - key: MAX_BROWSER_GENES
        value: "250"
